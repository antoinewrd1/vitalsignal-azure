# Local dev runs on DuckDB reading the Parquet the Spark jobs wrote.
# Production runs on an Azure Databricks SQL Warehouse against the same models.
vitalsignal:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('VS_LOCAL_ROOT', '../../_lake') }}/gold/warehouse.duckdb"
      threads: 4
      # extensions: [httpfs, azure]   # enable to read abfss:// straight from DuckDB

    prod:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: vitalsignal        # Unity Catalog
      schema: gold
      threads: 8
